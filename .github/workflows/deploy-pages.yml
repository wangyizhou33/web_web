name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static files
        shell: bash
        run: |
          site_dir="$RUNNER_TEMP/wbc-pages"
          mkdir -p "$site_dir/assets"
          cp index.html styles.css site.js "$site_dir/"
          cp -R demo1 demo2 "$site_dir/"
          cp assets/arch.png assets/systenid.png "$site_dir/assets/"
          cp -R assets/fonts assets/web "$site_dir/assets/"

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/wbc-pages

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
